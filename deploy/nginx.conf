# Staging config — serves staging.debate.report + customer subdomains → port 3004
# Cutover: swap server_name to debate.report www.debate.report when ready
#
# Bootstrap (first run on a new server):
#   1. Add DNS A record: staging.debate.report → this server's IP
#   2. sudo cp deploy/nginx.conf /etc/nginx/sites-available/staging.debate.report
#   3. sudo ln -s /etc/nginx/sites-available/staging.debate.report /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. sudo certbot --nginx -d staging.debate.report
#
# Adding a new customer subdomain (e.g. scotparl.staging.debate.report):
#   1. Add DNS A record: scotparl.staging.debate.report → this server's IP
#   2. Add the subdomain to server_name in both server blocks below
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot --nginx -d staging.debate.report -d scotparl.staging.debate.report
#      (expands the existing cert to include the new subdomain)
#   5. sudo nginx -t && sudo systemctl reload nginx
#
# Deploy updates: bash deploy/deploy.sh

server {
    listen 80;
    server_name staging.debate.report scotparl.staging.debate.report;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name staging.debate.report scotparl.staging.debate.report;

    ssl_certificate     /etc/letsencrypt/live/staging.debate.report/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.debate.report/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass         http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 180;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3004;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
