# Place at: /etc/nginx/sites-available/debate.report
# Enable:   sudo ln -s /etc/nginx/sites-available/debate.report /etc/nginx/sites-enabled/
# Test:     sudo nginx -t
# Reload:   sudo systemctl reload nginx

server {
    listen 80;
    server_name debate.report www.debate.report;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name debate.report www.debate.report;

    ssl_certificate     /etc/letsencrypt/live/debate.report/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/debate.report/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Proxy to Next.js on port 3004
    location / {
        proxy_pass         http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache Next.js static assets aggressively — they are content-hashed
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3004;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
