# poll.new.vote — replaces voter.care
# Serves poll.new.vote → port 3003 (voter-care app)
#
# First-time setup:
#   1. Ensure DNS A record exists for poll.new.vote → 194.163.173.19
#   2. sudo cp deploy/nginx-poll.new.vote.conf /etc/nginx/sites-available/poll.new.vote
#   3. sudo ln -s /etc/nginx/sites-available/poll.new.vote /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. sudo certbot --nginx -d poll.new.vote
#   6. sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name poll.new.vote;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name poll.new.vote;

    ssl_certificate     /etc/letsencrypt/live/poll.new.vote/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poll.new.vote/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass         http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 180;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3003;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
