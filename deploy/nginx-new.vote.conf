# new.vote — production config
# Serves new.vote, www.new.vote, scotparl.new.vote → port 3004 (debate-report app)
#
# First-time setup:
#   1. Ensure DNS A records exist for new.vote, www.new.vote, scotparl.new.vote → 194.163.173.19
#   2. sudo cp deploy/nginx-new.vote.conf /etc/nginx/sites-available/new.vote
#   3. sudo ln -s /etc/nginx/sites-available/new.vote /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. sudo certbot --nginx -d new.vote -d www.new.vote -d scotparl.new.vote
#   6. sudo nginx -t && sudo systemctl reload nginx
#
# Adding a new customer subdomain (e.g. acmecorp.new.vote):
#   1. Add DNS A record: acmecorp.new.vote → 194.163.173.19
#   2. Add acmecorp.new.vote to server_name in both server blocks below
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot --nginx -d new.vote -d www.new.vote -d scotparl.new.vote -d acmecorp.new.vote
#   5. sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name new.vote www.new.vote scotparl.new.vote;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name new.vote www.new.vote scotparl.new.vote;

    ssl_certificate     /etc/letsencrypt/live/new.vote/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.vote/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # www → apex redirect
    if ($host = www.new.vote) {
        return 301 https://new.vote$request_uri;
    }

    location / {
        proxy_pass         http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 180;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3004;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
